name: Build and Deploy Android APK

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (development/integration/production)'
        required: false
        type: choice
        options:
          - development
          - integration
          - production
        default: 'development'

jobs:
  build-android-apk:
    name: Build and Deploy Android APK
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            ENV="pr"
            echo "pr_number=${{ github.event.number }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ENV="production"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            ENV="integration"
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            ENV="development"
          else
            ENV="development"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Determined environment: $ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web app
        run: npm run build

      - name: Initialize Capacitor (if needed)
        run: |
          if [ ! -d "android" ]; then
            if [ ! -f "capacitor.config.json" ]; then
              echo "Initializing Capacitor..."
              npx cap init "front" "com.front.app" --web-dir=dist
            fi
            echo "Adding Android platform..."
            npx cap add android
          else
            echo "Android platform already exists, skipping initialization"
          fi

      - name: Sync Capacitor
        run: |
          if [ -d "android" ]; then
            npx cap sync android
          else
            echo "Error: Android platform not found after initialization"
            exit 1
          fi

      - name: Build APK Debug
        run: |
          cd android
          ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Build APK Release (if production)
        if: steps.env.outputs.environment == 'production'
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS || '' }}
          ANDROID_KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_ALIAS_PASSWORD || '' }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DEV_GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP Project
        run: |
          gcloud config set project "${{ secrets.DEV_GCP_PROJECT_ID }}"

      - name: Setup GCS variables
        id: gcs
        run: |
          echo "BUCKET_NAME=front-apk-dev" >> $GITHUB_OUTPUT
          echo "PROJECT_ID=${{ secrets.DEV_GCP_PROJECT_ID }}" >> $GITHUB_OUTPUT

      - name: Check and create GCS bucket if needed
        run: |
          BUCKET_NAME="${{ steps.gcs.outputs.BUCKET_NAME }}"
          PROJECT_ID="${{ steps.gcs.outputs.PROJECT_ID }}"
          
          if ! gsutil ls -b "gs://${BUCKET_NAME}" 2>/dev/null; then
            echo "Bucket ${BUCKET_NAME} does not exist, creating it..."
            gsutil mb -p "${PROJECT_ID}" -l europe-west1 "gs://${BUCKET_NAME}"
            echo "Bucket ${BUCKET_NAME} created successfully"
          else
            echo "Bucket ${BUCKET_NAME} already exists"
          fi

      - name: Upload Debug APK to GCS
        id: upload-debug
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          BUCKET_NAME="${{ steps.gcs.outputs.BUCKET_NAME }}"
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          if [ "$ENV" == "pr" ]; then
            PR_NUMBER="${{ github.event.number }}"
            APK_NAME="front-pr-${PR_NUMBER}-debug-${SHA_SHORT}-${TIMESTAMP}.apk"
            GCS_DIR="gs://${BUCKET_NAME}/pr/${PR_NUMBER}"
          else
            APK_NAME="front-${ENV}-debug-${SHA_SHORT}-${TIMESTAMP}.apk"
            GCS_DIR="gs://${BUCKET_NAME}/${ENV}"
          fi
          
          GCS_PATH="${GCS_DIR}/${APK_NAME}"
          LATEST_PATH="${GCS_DIR}/latest.apk"
          
          if [ ! -f "${APK_PATH}" ]; then
            echo "Error: APK file not found at ${APK_PATH}"
            exit 1
          fi
          
          # Upload APK with timestamp
          gsutil cp "${APK_PATH}" "${GCS_PATH}"
          echo "APK uploaded to: ${GCS_PATH}"
          
          # Copy to latest.apk (always points to the latest version)
          gsutil cp "${APK_PATH}" "${LATEST_PATH}"
          echo "Latest APK available at: ${LATEST_PATH}"
          
          echo "APK_URL=${GCS_PATH}" >> $GITHUB_ENV
          echo "LATEST_APK_URL=${LATEST_PATH}" >> $GITHUB_ENV
          echo "apk_url=${GCS_PATH}" >> $GITHUB_OUTPUT
          echo "latest_apk_url=${LATEST_PATH}" >> $GITHUB_OUTPUT
          
          if [ "$ENV" == "pr" ]; then
            echo "PR APK available at: ${GCS_PATH}"
            echo "PR Latest APK available at: ${LATEST_PATH}"
            echo "::notice::APK disponible pour test: ${LATEST_PATH}"
          fi

      - name: Upload Release APK to GCS (if production)
        if: steps.env.outputs.environment == 'production'
        id: upload-release
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          BUCKET_NAME="${{ steps.gcs.outputs.BUCKET_NAME }}"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          APK_NAME="front-${ENV}-release-${SHA_SHORT}-${TIMESTAMP}.apk"
          GCS_DIR="gs://${BUCKET_NAME}/${ENV}"
          GCS_PATH="${GCS_DIR}/${APK_NAME}"
          LATEST_RELEASE_PATH="${GCS_DIR}/latest-release.apk"
          
          if [ ! -f "${APK_PATH}" ]; then
            echo "Error: Release APK file not found at ${APK_PATH}"
            exit 1
          fi
          
          # Upload APK with timestamp
          gsutil cp "${APK_PATH}" "${GCS_PATH}"
          echo "Release APK uploaded to: ${GCS_PATH}"
          
          # Copy to latest-release.apk
          gsutil cp "${APK_PATH}" "${LATEST_RELEASE_PATH}"
          echo "Latest Release APK available at: ${LATEST_RELEASE_PATH}"
          
          echo "RELEASE_APK_URL=${GCS_PATH}" >> $GITHUB_ENV
          echo "LATEST_RELEASE_APK_URL=${LATEST_RELEASE_PATH}" >> $GITHUB_ENV
          echo "release_apk_url=${GCS_PATH}" >> $GITHUB_OUTPUT
          echo "latest_release_apk_url=${LATEST_RELEASE_PATH}" >> $GITHUB_OUTPUT

      - name: Output APK locations
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          echo "Environment: ${ENV}"
          echo ""
          echo "📱 Debug APK:"
          echo "  - Versioned: ${APK_URL}"
          echo "  - Latest: ${LATEST_APK_URL}"
          echo ""
          if [ "${ENV}" == "production" ]; then
            echo "🚀 Release APK:"
            echo "  - Versioned: ${RELEASE_APK_URL}"
            echo "  - Latest: ${LATEST_RELEASE_APK_URL}"
            echo ""
          fi
          if [ "${ENV}" == "pr" ]; then
            echo "PR Number: ${{ github.event.number }}"
            echo "::notice::APK de test disponible pour la PR #${{ github.event.number }}"
            echo "::notice::Lien latest: ${LATEST_APK_URL}"
          fi

      - name: Comment PR with APK link
        if: steps.env.outputs.environment == 'pr'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_URL: ${{ env.APK_URL }}
          LATEST_APK_URL: ${{ env.LATEST_APK_URL }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const apkUrl = process.env.APK_URL;
            const sha = context.sha.substring(0, 7);
            
            const latestApkUrl = process.env.LATEST_APK_URL;
            
            const comment = `## 📱 APK de test disponible
            
            Un APK de test a été généré pour cette PR :
            
            - **APK Debug (versioned)**: \`${apkUrl}\`
            - **APK Debug (latest)**: \`${latestApkUrl}\` ⭐
            - **Commit**: \`${sha}\`
            
            > ⚠️ Cet APK sera automatiquement supprimé lorsque la PR sera fermée ou mergée.
            
            Pour télécharger l'APK latest, utilisez la commande :
            \`\`\`bash
            gsutil cp "${latestApkUrl}" ./app-debug.apk
            \`\`\`
            `;
            
            // Trouver et mettre à jour le commentaire existant ou en créer un nouveau
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('APK de test disponible')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment,
              });
            }

  cleanup-pr-apk:
    name: Cleanup PR APK
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DEV_GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP Project
        run: |
          gcloud config set project "${{ secrets.DEV_GCP_PROJECT_ID }}"

      - name: Delete PR APK folder
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BUCKET_NAME="front-apk-dev"
          PR_FOLDER="gs://${BUCKET_NAME}/pr/${PR_NUMBER}/"
          
          echo "Deleting APK folder for PR #${PR_NUMBER}: ${PR_FOLDER}"
          
          if gsutil ls "${PR_FOLDER}" 2>/dev/null; then
            gsutil -m rm -r "${PR_FOLDER}"
            echo "Successfully deleted APK folder for PR #${PR_NUMBER}"
          else
            echo "No APK folder found for PR #${PR_NUMBER}, skipping deletion"
          fi

