name: Deploy to Development
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Docker image tag to deploy (default: dev-{sha})'
        required: false
        type: string
        default: ''
      force-deploy:
        description: 'Force deployment even if no changes'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    name: Compute docker tag
    runs-on: ubuntu-latest
    outputs:
      docker-tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: |
          if [ -n "${{ github.event.inputs.image-tag }}" ]; then
            echo "value=${{ github.event.inputs.image-tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "value=pr-${{ github.event.number }}-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          else
            echo "value=dev-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          fi

  deploy-dev:
    name: Deploy to Development
    needs: prepare
    uses: projet-ccm2/shared-workflows/.github/workflows/nodejs-cd.yml@main
    with:
      required_env_vars: GCP_SA_KEY,GCP_PROJECT_ID,TWITCH_CLIENT_ID,AUTH_SERVICE_URL,ACHIEVEMENT_MANAGEMENT_SERVICE_URL,API_SERVICE_URL,FRONT_URL
      docker-image-name: front-dev
      docker-tag: ${{ needs.prepare.outputs.docker-tag }}
      artifact-registry-repository: 'front-docker-dev'
      environment: development
      cloud-run-service-name: front-dev
      cloud-run-port: '4173'
    secrets:
      GCP_SA_KEY: ${{ secrets.DEV_GCP_SA_KEY }}
      GCP_PROJECT_ID: ${{ secrets.DEV_GCP_PROJECT_ID }}
      TWITCH_CLIENT_ID: ${{ secrets.DEV_TWITCH_CLIENT_ID }}
      AUTH_SERVICE_URL: ${{ secrets.DEV_AUTH_SERVICE_URL }}
      ACHIEVEMENT_MANAGEMENT_SERVICE_URL: ${{ secrets.DEV_ACHIEVEMENT_MANAGEMENT_SERVICE_URL }}
      API_SERVICE_URL: ${{ secrets.DEV_API_SERVICE_URL }}
      FRONT_URL: ${{ secrets.DEV_FRONT_URL }}
