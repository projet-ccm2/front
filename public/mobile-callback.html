<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retour à StreamQuest</title>
  </head>
  <body style="font-family: sans-serif; padding: 20px; color: #333; background: #fff;">
    <h2 style="color: #9146FF;">StreamQuest — Callback</h2>
    <pre id="log" style="background: #f4f4f4; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; font-size: 12px;"></pre>
    <p>
      <a id="open-link" style="display:none; color: #fff; background: #9146FF; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-size: 18px;">
        Ouvrir StreamQuest
      </a>
    </p>
    <script>
      var logEl = document.getElementById('log');
      function log(msg) {
        logEl.textContent += msg + '\n';
      }

      try {
        log('href = ' + window.location.href);
        log('hash length = ' + window.location.hash.length);
        log('search = ' + window.location.search);

        var hash = window.location.hash;
        var search = window.location.search;

        // Twitch error case: ?error=...&error_description=...
        if (search && search.indexOf('error') !== -1) {
          log('Twitch returned an error in query string');
          return;
        }

        var payload = '';
        if (hash && hash.indexOf('access_token') !== -1) {
          payload = hash.charAt(0) === '#' ? hash.substring(1) : hash;
        } else if (search && search.indexOf('access_token') !== -1) {
          payload = search.charAt(0) === '?' ? search.substring(1) : search;
        }

        if (!payload) {
          log('ERROR: no access_token found in URL');
        } else {
          var appUrl = 'com.streamquest.app://callback?' + payload;
          log('Redirecting to: ' + appUrl.substring(0, 80) + '...');

          var link = document.getElementById('open-link');
          link.href = appUrl;
          link.style.display = 'inline-block';

          // Try auto-redirect, fallback to button if it fails
          window.location.href = appUrl;

          setTimeout(function() {
            log('Auto-redirect did not fire — tap the button above.');
          }, 2500);
        }
      } catch (e) {
        log('JS ERROR: ' + (e && e.message ? e.message : String(e)));
      }
    </script>
  </body>
</html>
