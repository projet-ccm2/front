<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retour à StreamQuest</title>
  </head>
  <body style="font-family: sans-serif; text-align: center; margin-top: 60px; color: #333;">
    <p id="msg">Redirection vers l'application...</p>
    <p id="fallback" style="display:none;">
      <a id="fallback-link" style="color: #9146FF; font-size: 18px;">
        Ouvrir StreamQuest
      </a>
    </p>
    <script>
      var hash = window.location.hash;
      if (hash.includes('access_token')) {
        var queryString = hash.substring(1);
        var appUrl = 'com.streamquest.app://callback?' + queryString;

        var fallback = document.getElementById('fallback');
        var link = document.getElementById('fallback-link');
        link.href = appUrl;
        setTimeout(function() { fallback.style.display = 'block'; }, 1500);

        window.location.href = appUrl;
      }
    </script>
  </body>
</html>
