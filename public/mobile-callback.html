<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      var hash = window.location.hash
      if (hash.includes('access_token')) {
        // Convert hash params to query string for the intent:// URL format
        // (Chrome Custom Tabs require intent:// to reliably open the app)
        var queryString = hash.substring(1)
        var intentUrl =
          'intent://callback?' +
          queryString +
          '#Intent;scheme=com.streamquest.app;package=com.streamquest.app;end'
        window.location.replace(intentUrl)
      }
    </script>
  </body>
</html>
